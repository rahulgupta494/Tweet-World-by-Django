{% extends "layout.html" %}

{% block title %}
Delete Tweet
{% endblock %}

{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 75vh;">
<div class="card border-0 shadow-lg rounded-4 p-4 text-center"
     style="max-width: 450px; width: 100%; background-color: #212529;">
    <div class="card-body">
        <div class="fs-1 mb-3">⚠️</div>
        <h2 class="fw-bold mb-3">
            Delete Tweet?
        </h2>
        <p class="text-secondary mb-4">
            Are you sure you want to delete this tweet?
            <br>
            This action cannot be undone.
        </p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3">
                <button type="submit"
                        class="btn btn-danger px-4 rounded-pill">
                    Delete
                </button>
                <a class="btn btn-outline-secondary px-4 rounded-pill"
                   href="{% url 'tweet_list' %}">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
</div>
{% endblock %}
